<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Score Predictor</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }
      .wrap {
        max-width: 720px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px 0;
        color: #4b5563;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      button {
        margin-top: 16px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .result {
        margin-top: 20px;
        padding: 16px;
        background: #f3f4f6;
        border-radius: 8px;
      }
      .error {
        color: #b91c1c;
      }
      .footer {
        margin-top: 16px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Student Score Predictor</h1>
        <p>Enter values to get the predicted score and recommendation.</p>

        <label for="study_hours">Study Hours</label>
        <input id="study_hours" type="number" min="0" step="0.1" value="5" />

        <label for="attendance">Attendance (0 to 1)</label>
        <input id="attendance" type="number" min="0" max="1" step="0.01" value="0.9" />

        <label for="sleep_hours">Sleep Hours</label>
        <input id="sleep_hours" type="number" min="0" step="0.1" value="7" />

        <button id="submitBtn">Predict</button>

        <div id="result" class="result" style="display:none;"></div>
        <div id="error" class="error" style="display:none;"></div>

        <div class="footer">API: POST /predict</div>
      </div>
    </div>

    <script>
      const btn = document.getElementById("submitBtn");
      const resultEl = document.getElementById("result");
      const errorEl = document.getElementById("error");

      function showResult(data) {
        const score = Number(data.predicted_score).toFixed(2);
        resultEl.style.display = "block";
        errorEl.style.display = "none";
        resultEl.innerHTML =
          "<strong>Predicted score:</strong> " + score + "<br/>" +
          "<strong>Decision:</strong> " + data.agent_decision + "<br/>" +
          "<strong>Recommendation:</strong> " + data.recommendation;
      }

      function showError(message) {
        errorEl.style.display = "block";
        resultEl.style.display = "none";
        errorEl.textContent = message;
      }

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        const payload = {
          study_hours: parseFloat(document.getElementById("study_hours").value),
          attendance: parseFloat(document.getElementById("attendance").value),
          sleep_hours: parseFloat(document.getElementById("sleep_hours").value),
        };

        try {
          const res = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            throw new Error("Request failed with status " + res.status);
          }
          const data = await res.json();
          showResult(data);
        } catch (err) {
          showError(err.message || "Request failed");
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
